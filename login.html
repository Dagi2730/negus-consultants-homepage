<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In | Negus Consultants Student Portal</title>
  <meta name="description" content="Access your Negus Consultants student portal for application roadmaps, SAT/IELTS preparation, and essay reviews.">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Noto+Sans+Ethiopic:wght@400;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/sections.css">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body>

  <div class="standalone-nav">
    <a href="index.html" class="back-home-link">
      <i data-lucide="arrow-left" style="width: 16px; height: 16px;"></i>
      <span>Back to Homepage</span>
    </a>

    <button class="theme-toggle-btn" id="theme-toggle" onclick="toggleTheme()" aria-label="Switch theme">
      <span class="theme-switch-track">
        <i data-lucide="sun" style="width: 12px; height: 12px;"></i>
        <i data-lucide="moon" style="width: 12px; height: 12px;"></i>
        <span class="theme-switch-thumb"></span>
      </span>
    </button>
  </div>

  <div class="modal-card">
    <div class="portal-modal-header">
      <div class="portal-brand-row">
        <img src="assets/images/logo.png" onerror="this.onerror=null; this.src='assets/images/negus_logo.png';" alt="Negus Logo" class="portal-logo-icon">
        <div class="portal-brand-text">
          <span class="portal-brand-name">NEGUS</span>
          <span class="portal-brand-badge">STUDENT PORTAL</span>
        </div>
      </div>
      <a href="index.html" class="back-home-link" style="color: var(--ink-600);">
        <i data-lucide="x" style="width: 20px; height: 20px;"></i>
      </a>
    </div>

    <div class="portal-tabs-track" role="tablist">
      <button class="portal-tab-pill active" id="tab-btn-signin" role="tab" aria-selected="true" onclick="switchAuthTab('login')">
        Sign In
      </button>
      <button class="portal-tab-pill " id="tab-btn-register" role="tab" aria-selected="false" onclick="switchAuthTab('register')">
        Register
      </button>
    </div>

    <div id="portal-alert" class="portal-status-alert"></div>

    <!-- SIGN IN PANEL -->
    <div id="auth-panel-login" class="portal-form-panel" style="display: block;">
      <h3 class="portal-panel-title">Student Portal Login</h3>
      <p class="portal-panel-subtitle">Access your courses, application roadmap, and essay revisions.</p>

      <form onsubmit="handleSubmit(event, 'Signed in successfully!')">
        <div class="portal-field-group">
          <label class="portal-field-label" for="login-id">Email Address or Student ID *</label>
          <input type="text" id="login-id" class="portal-field-input" placeholder="e.g. name@example.com" required>
        </div>

        <div class="portal-field-group">
          <div class="portal-label-row">
            <label class="portal-field-label" for="login-password">Password *</label>
            <a href="javascript:void(0)" onclick="alert('Password reset link sent to your email.');" class="portal-forgot-link">Forgot?</a>
          </div>
          <input type="password" id="login-password" class="portal-field-input" placeholder="••••••••" required>
        </div>

        <div class="portal-remember-row">
          <label class="portal-checkbox-label">
            <input type="checkbox" checked>
            <span>Remember this device</span>
          </label>
        </div>

        <button type="submit" class="portal-submit-btn">
          <span>Sign In to Student Portal</span>
          <i data-lucide="arrow-right" style="width: 18px; height: 18px;"></i>
        </button>

        <div class="portal-footer-switch">
          Don't have an account yet? <button type="button" class="portal-switch-link" onclick="switchAuthTab('register')">Register now</button>
        </div>
      </form>
    </div>

    <!-- REGISTER PANEL -->
    <div id="auth-panel-register" class="portal-form-panel" style="display: none;">
      <h3 class="portal-panel-title">Create Student Account</h3>
      <p class="portal-panel-subtitle">Join thousands of Ethiopian scholars preparing for study abroad.</p>

      <form onsubmit="handleSubmit(event, 'Account created successfully!')">
        <div class="portal-field-group">
          <label class="portal-field-label">Full Name *</label>
          <input type="text" class="portal-field-input" placeholder="e.g. Full name" required>
        </div>

        <div class="portal-field-group">
          <label class="portal-field-label">Email Address *</label>
          <input type="email" class="portal-field-input" placeholder="e.g. name@example.com" required>
        </div>

        <div class="portal-field-group">
          <label class="portal-field-label">Phone / Telegram Handle *</label>
          <input type="text" class="portal-field-input" placeholder="e.g. +251 9... or @username" required>
        </div>

        <div class="portal-field-group">
          <label class="portal-field-label">Primary Area of Interest</label>
          <select class="portal-field-select">
            <option value="admissions" selected>Scholarships & University Admissions</option>
            <option value="sat">Digital SAT Preparation</option>
            <option value="ielts">IELTS Academic Coaching</option>
            <option value="essays">Essay Writing & Review (2,000 Birr Package)</option>
            <option value="mentorship">Full Application Mentorship</option>
            <option value="advisory">General Guidance & Planning</option>
          </select>
        </div>

        <div class="portal-field-group">
          <label class="portal-field-label">Create Password *</label>
          <input type="password" class="portal-field-input" placeholder="Minimum 6 characters" minlength="6" required>
        </div>

        <button type="submit" class="portal-submit-btn">
          <span>Create Student Account</span>
          <i data-lucide="check" style="width: 18px; height: 18px;"></i>
        </button>

        <div class="portal-footer-switch">
          Already have an account? <button type="button" class="portal-switch-link" onclick="switchAuthTab('login')">Sign in</button>
        </div>
      </form>
    </div>
  </div>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="js/auth.js" defer></script>
</body>
</html>
